<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Mahesh Bharti E-book Store video preview</title>
  <desc id="desc">Warm orange video poster with a centered play symbol.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#431407"/>
      <stop offset=".55" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#fed7aa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1c0702" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <circle cx="170" cy="90" r="250" fill="#fb923c" opacity=".14"/>
  <circle cx="1110" cy="650" r="300" fill="#fdba74" opacity=".12"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <g fill="none" stroke="#fed7aa" stroke-opacity=".28">
    <circle cx="640" cy="320" r="112"/>
    <circle cx="640" cy="320" r="148"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="640" cy="320" r="78" fill="#fff7ed"/>
    <path d="M620 278 690 320 620 362Z" fill="#c2410c"/>
  </g>
  <text x="640" y="486" fill="#fff7ed" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">Mahesh Bharti E-book Store</text>
  <text x="640" y="540" fill="#fed7aa" font-family="Arial, sans-serif" font-size="24" letter-spacing="5" text-anchor="middle">AUTHOR VIDEO PREVIEW</text>
</svg>
